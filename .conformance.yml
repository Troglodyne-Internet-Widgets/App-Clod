flavor: troglodyne-5.040
source:
  git: https://github.com/Troglodyne-Internet-Widgets/perl-slop-plugin.git
  path: skills/packaging-perl
variables:
  DIST: App-Clod
  AUTHOR_NAME: George S. Baugh
  AUTHOR_EMAIL: george@troglodyne.net
  COPYRIGHT_HOLDER: Troglodyne LLC
  YEAR: '2026'
  CPAN_ID: TEODESIAN
checks:
  CriticProfile:
    overrides:
      # The tests run the fakes in t/bin directly, as the programs that they
      # stand in for, and no kernel starts a program whose first line is
      # #!perl until an install rewrites it.  Everything else keeps #!perl.
      logicLAB::RequireSheBang:
        formats: '#!perl || #!/usr/bin/env perl'
